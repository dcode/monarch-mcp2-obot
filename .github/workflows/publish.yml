name: Publish

# Two independent distribution paths from the same build:
#
# 1. Build the wheel/sdist and turn a pushed `vX.Y.Z` tag into a GitHub
#    release with those files attached -- the primary distribution path
#    for now (semantic-versioned tags, immutable release assets, no PyPI
#    dependency).
#
#    GitHub releases are immutable once published: assets can only be
#    uploaded to a release *before* it's published, not after (uploading
#    after publish fails with "Cannot upload asset ... to an immutable
#    release"). So this can't be a `release: published` reaction anymore --
#    by the time that event fires, it's already too late to attach
#    anything. Instead: build first, create the release as a draft with
#    the files attached (drafts allow uploads), then publish it -- assets
#    are already in place by the time it locks.
#
#    Release notes are auto-generated from merged PRs since the previous
#    tag (`generate_release_notes: true`); edit them after the fact with
#    `gh release edit <tag> --notes "..."` if you want something more
#    curated -- editing title/notes text isn't blocked by immutability,
#    only asset uploads are.
#
# 2. Publish to PyPI via Trusted Publishing (OIDC, no stored token) against
#    the `pypi` environment -- manual `workflow_dispatch` only, not
#    automatic on a tag push. NOTE: as of this writing, this package
#    depends on monarch-api2 via a direct GitHub reference (no PyPI release
#    of that dependency exists yet), and PyPI's upload validation rejects
#    any package whose metadata contains a direct/VCS `Requires-Dist` -- so
#    a publish run against the current dependency pin will be rejected by
#    PyPI. See "Publishing to PyPI" in ROADMAP.md. Re-pin monarch-api2 to a
#    PyPI release before running this.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          draft: true
          generate_release_notes: true

      - run: gh release edit "${{ github.ref_name }}" --draft=false -R "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/monarch-mcp2-obot/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
