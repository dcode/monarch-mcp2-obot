name: Publish

# Publishes via PyPI Trusted Publishing (OIDC, no stored token) against the
# `pypi` environment. NOTE: as of this writing, this package depends on
# monarch-api2 via a direct GitHub reference (no PyPI release of that
# dependency exists yet), and PyPI's upload validation rejects any package
# whose metadata contains a direct/VCS `Requires-Dist` -- so a publish run
# against the current dependency pin will be rejected by PyPI. See
# "Publishing to PyPI" in ROADMAP.md. Re-pin monarch-api2 to a PyPI release
# before tagging a release that's meant to actually publish.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/monarch-mcp2-obot/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
